<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin | Grade Card Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container mt-4 p-4 border rounded bg-white shadow-lg">
    <!-- Header -->
    <div class="text-center mb-4">
      <img src="https://upload.wikimedia.org/wikipedia/en/thumb/e/e1/Jamia_Millia_Islamia.svg/1200px-Jamia_Millia_Islamia.svg.png" width="90" alt="JMI Logo" />
      <h5 class="mt-2 text-success fw-bold">جامعہ ملیہ اسلامیہ</h5>
      <h4 class="fw-bold text-uppercase">Jamia Millia Islamia, New Delhi</h4>
      <h5 class="text-uppercase">Diploma in Computer Engineering</h5>
      <h6 class="text-secondary">Semester-IV Examination 2025</h6>
    </div>

    <!-- Student Info -->
    <form method="POST" action="admin_action.php">
      <div class="row g-3 mb-3">
        <div class="col-md-4">
          <label class="form-label">Student Name</label>
          <input type="text" name="student_name" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Father's Name</label>
          <input type="text" name="father_name" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Roll Number</label>
          <input type="text" name="roll_no" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Enrolment Number</label>
          <input type="text" name="enrolment_no" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Category</label>
          <select name="category" class="form-select">
            <option>Regular</option>
            <option>Self-Financed</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Branch</label>
          <input type="text" name="branch" class="form-control" value="Computer Engineering" />
        </div>
      </div>

      <!-- Subject Marks Table -->
      <div class="table-responsive mb-4">
        <table class="table table-bordered text-center align-middle">
          <thead class="table-secondary">
            <tr>
              <th>Course No</th>
              <th>Subject</th>
              <th>IA</th>
              <th>IAP</th>
              <th>ESE</th>
              <th>ESPE</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody id="subject-table">
            <tr>
              <td><input name="course_no[]" class="form-control" value="DCO-402"></td>
              <td><input name="subject[]" class="form-control" value="Database Management System"></td>
              <td><input name="ia[]" type="number" class="form-control" required></td>
              <td><input name="iap[]" type="number" class="form-control"></td>
              <td><input name="ese[]" type="number" class="form-control"></td>
              <td><input name="espe[]" type="number" class="form-control"></td>
              <td><input name="total[]" type="number" class="form-control" readonly></td>
            </tr>
          </tbody>
        </table>
        <button type="button" class="btn btn-outline-primary btn-sm" onclick="addSubjectRow()">+ Add Subject</button>
      </div>

      <!-- Result Status -->
      <div class="row mb-3">
        <div class="col-md-4">
          <label class="form-label">Total Marks</label>
          <input type="number" name="total_marks" class="form-control" />
        </div>
        <div class="col-md-4">
          <label class="form-label">Max Marks</label>
          <input type="number" name="max_marks" class="form-control" value="700" />
        </div>
        <div class="col-md-4">
          <label class="form-label">Result</label>
          <select name="result" class="form-select">
            <option>Passed</option>
            <option>Failed</option>
          </select>
        </div>
      </div>

      <div class="text-end">
        <button class="btn btn-success">Save Grade Card</button>
      </div>
    </form>

    <!-- Footer -->
    <div class="text-center mt-5 small text-muted">
      <p>This is a computer-generated form. To be verified by the Examination Branch JMI.</p>
      <p>© Jamia Millia Islamia</p>
    </div>
  </div>

  <script>
    function addSubjectRow() {
      const row = `
      <tr>
        <td><input name="course_no[]" class="form-control"></td>
        <td><input name="subject[]" class="form-control"></td>
        <td><input name="ia[]" type="number" class="form-control"></td>
        <td><input name="iap[]" type="number" class="form-control"></td>
        <td><input name="ese[]" type="number" class="form-control"></td>
        <td><input name="espe[]" type="number" class="form-control"></td>
        <td><input name="total[]" type="number" class="form-control" readonly></td>
      </tr>`;
      document.getElementById('subject-table').insertAdjacentHTML('beforeend', row);
    }
  </script>
</body>
</html>
